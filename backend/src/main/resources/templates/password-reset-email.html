<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 2px;
            margin: 20px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .footer {
            margin-top: 30px;
            color: #7f8c8d;
            font-size: 12px;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Forgot your password?</h1>

    <p>We received a password reset request for your account:</p>
    <p><a th:href="'mailto:' + ${email}" th:text="${email}">user@example.com</a></p>

    <p><strong>Use the OTP below to reset the password.</strong></p>

    <div class="otp-code" th:text="${otp}">123456</div>

    <p>The password reset OTP is only valid for the next 15 minutes.</p>

    <div class="footer">
        <p>If you did not request a password reset, please ignore this email.</p>
    </div>
</body>
</html>
